plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.canallibre.iptv'
    compileSdk 36

    defaultConfig {
        applicationId 'fr.canallibre.iptv'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '2.1'
        // Téléphones, tablettes, box Android TV et Fire TV (processeurs ARM)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    signingConfigs {
        release {
            storeFile file('canallibre.jks')
            storePassword 'canallibre'
            keyAlias 'canallibre'
            keyPassword 'canallibre'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    def media3 = '1.9.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // Décodeur audio FFmpeg (AC3, E-AC3, DTS, MP2...) précompilé par le projet Jellyfin
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1'
    // Moteur VLC pour le direct : résiste aux flux MPEG-TS imparfaits des serveurs IPTV
    implementation 'org.videolan.android:libvlc-all:3.6.0'
}
