plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.canallibre.iptv'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.canallibre.iptv'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile file('canallibre.jks')
            storePassword 'canallibre'
            keyAlias 'canallibre'
            keyPassword 'canallibre'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
