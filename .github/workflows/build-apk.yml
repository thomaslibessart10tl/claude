name: Build APK Canal Libre

on:
  push:
    branches: [canal-libre-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Embarquer hls.js dans l'application
        run: curl -fsSL https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js -o app/src/main/assets/hls.min.js

      - name: Compiler l'APK signé
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk CanalLibre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CanalLibre-apk
          path: CanalLibre.apk

      - name: Publier une release téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canal-libre-v1.1.1-build${{ github.run_number }}
          name: Canal Libre 1.1.1 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: "APK Android du lecteur IPTV Canal Libre. Téléchargez CanalLibre.apk ci-dessous et installez-le sur votre téléphone ou box Android."
          files: CanalLibre.apk
