name: Build APK Canal Libre

on:
  push:
    branches: [canal-libre-android, dev-2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compiler l'APK signé
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|e: |What went wrong|Could not|> |FAILURE|Caused by" build.log | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk CanalLibre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CanalLibre-apk
          path: CanalLibre.apk

      - name: Publier une release téléchargeable
        if: github.ref == 'refs/heads/canal-libre-android'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canal-libre-v2.0.2-build${{ github.run_number }}
          name: Canal Libre 2.0.2 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: "APK Android du lecteur IPTV Canal Libre. Téléchargez CanalLibre.apk ci-dessous et installez-le sur votre téléphone ou box Android."
          files: CanalLibre.apk
